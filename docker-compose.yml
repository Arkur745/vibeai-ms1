version: "3.9"

services:

  redis:

    image: redis:7

    container_name: redis

    ports:
      - "6379:6379"


  api:

    build: .

    container_name: vibeai-api

    ports:
      - "8000:8000"

    depends_on:
      - redis

    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000


  worker:

    build: .

    container_name: vibeai-worker

    depends_on:
      - redis

    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

    command: >
      celery -A app.workers.tasks
      worker
      --pool=solo
      --loglevel=info


  mlflow:

    image: ghcr.io/mlflow/mlflow:v2.12.1

    container_name: mlflow

    ports:
      - "5000:5000"

    command: >
      mlflow ui
      --host 0.0.0.0


  prometheus:

    image: prom/prometheus

    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml


  grafana:

    image: grafana/grafana

    container_name: grafana

    ports:
      - "3000:3000"

    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin